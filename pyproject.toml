[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "store_labor_capacity_planning"
version = "0.2.0"
description = "门店客流预测、岗位需求、排班方案比较与回看（本地合成资料）"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
store-labor = "store_labor_capacity_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_labor_capacity_planning = ["py.typed"]
